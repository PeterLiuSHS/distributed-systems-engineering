apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-resilient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-resilient
  template:
    metadata:
      labels:
        app: client-resilient
    spec:
      containers:
      - name: client
        image: client-resilient:latest
        imagePullPolicy: Never
        env:
        - name: BACKEND_URL
          value: "http://backend-service:5000/data"
        - name: PYTHONUNBUFFERED
          value: "1"