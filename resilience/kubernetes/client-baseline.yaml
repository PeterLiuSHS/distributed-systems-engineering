apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-baseline
  template:
    metadata:
      labels:
        app: client-baseline
    spec:
      containers:
      - name: client
        image: client-baseline:latest
        imagePullPolicy: Never
        env:
        - name: BACKEND_URL
          value: "http://backend-service:5000/data"
        - name: PYTHONUNBUFFERED
          value: "1"